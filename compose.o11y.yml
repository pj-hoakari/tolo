# 監視 (observability) スタック用のオーバーライド
# ベースに重ねて使う:
#   docker compose -f compose.yml -f compose.o11y.yml up --build
services:
    jaeger:
        image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP
        networks:
            - jaeger

    server:
        environment:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
            OTEL_SERVICE_NAME: tolo-service-gateway
        networks:
            - jaeger
        depends_on:
            jaeger:
                condition: service_started

networks:
    jaeger:
