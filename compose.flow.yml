services:
    flow-control:
        image: ${TOLO_FLOW_IMAGE:-tolo-flow-control:dfd748a}
        build:
            context: https://github.com/pj-hoakari/tolo-flow-control.git#dfd748a88473048ddd0d13bf02441e474d2a4434
        environment:
            PORT: "8080"
            TOLO_RPC_MAX_REQUEST_BYTES: "8388608"
            TOLO_RPC_MAX_EXECUTION_SEC: "720"
            TOLO_GRAPH_MAX_NODES: "60"
            TOLO_GRAPH_MAX_EDGES: "150"
        read_only: true
        tmpfs:
            - /tmp
        networks:
            - flow-control

    observation:
        depends_on:
            flow-control:
                condition: service_started

    runn:
        image: ghcr.io/k1low/runn:v1.11.1@sha256:0c71b25001b3d9acc506f8c69ffd0b1d11625127474fcf13ff7bad2d5a0ccd95
        profiles:
            - runn
        working_dir: /books
        command: ["run", "--verbose", "integration-proposal.yml"]
        environment:
            OBSERVATION_DB_DSN: postgres://observation-db:5432/observation?sslmode=disable&user=observation&password=${TOLO_OBS_DB_PASSWORD:-observation}
        volumes:
            - ./scripts/runbooks:/books:ro
        networks:
            - idp
            - observation-db
        depends_on:
            server:
                condition: service_started
            observation:
                condition: service_started
