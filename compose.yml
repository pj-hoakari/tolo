name: tolo

services:
    keygen:
        image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              set -eu
              if [ ! -f /keys/signing-key.pem ]; then
                openssl ecparam -name prime256v1 -genkey -noout -out /keys/signing-key.pem
                chown 65532:65532 /keys/signing-key.pem
                chmod 0400 /keys/signing-key.pem
              fi
              if [ ! -f /idp/introspection-client-secret ]; then
                openssl rand -hex 16 > /idp/introspection-client-secret
                chown 65532:65532 /idp/introspection-client-secret
                chmod 0400 /idp/introspection-client-secret
              fi
        volumes:
            - internal-jwt-keys:/keys
            - idp-introspection:/idp
        restart: "no"

    server:
        image: ${TOLO_GATEWAY_IMAGE:-tolo-service-gateway:d892c75}
        build:
            context: https://github.com/pj-hoakari/tolo-service-gateway.git#d892c758cd560f6df715aea6947ff4a07c4f5ced
            target: server
        environment:
            TOLO_GATEWAY_LISTENER_MODE: split
            TOLO_GATEWAY_PUBLIC_PORT: "8080"
            TOLO_GATEWAY_INTERNAL_PORT: "8090"
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_SIGNING_KEY_FILE: /etc/tolo/keys/signing-key.pem
            INTERNAL_JWT_SIGNING_KEY_ID: dev-key-1
            TOLO_GATEWAY_DESTINATIONS_FILE: /etc/tolo/gateway/destinations.json
            IDP_ISSUER: http://fakeidp:8080
            IDP_AUDIENCE: backend-api
            IDP_INTROSPECTION_CLIENT_ID: gateway-introspection
            IDP_INTROSPECTION_CLIENT_SECRET_FILE: /etc/tolo/idp/introspection-client-secret
        ports:
            - "8080:8080"
        volumes:
            - internal-jwt-keys:/etc/tolo/keys:ro
            - idp-introspection:/etc/tolo/idp:ro
            - ./config/destinations.json:/etc/tolo/gateway/destinations.json:ro
        networks:
            - idp
        depends_on:
            keygen:
                condition: service_completed_successfully

    nats:
        image: nats:2-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
        command: ["-js", "-m", "8222"]
        networks:
            - push-relay
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
            interval: 5s
            timeout: 5s
            retries: 10

    push-relay:
        image: ${TOLO_PUSH_RELAY_IMAGE:-jetstream-http-push:ef072ef}
        build:
            context: https://github.com/pj-hoakari/jetstream-http-push.git#ef072ef951b5d77c5d02fbe79e1d5ce81ed0b2fa
        environment:
            NATS_URL: nats://nats:4222
            SUBSCRIPTIONS_FILE: /etc/jetstream-http-push/subscriptions.json
        volumes:
            - ./config/push/subscriptions.json:/etc/jetstream-http-push/subscriptions.json:ro
        networks:
            - push-relay
            - push
        depends_on:
            nats:
                condition: service_healthy

volumes:
    internal-jwt-keys:
    idp-introspection:
        name: tolo-idp-introspection

networks:
    idp:
        name: tolo-idp
    push-relay:
        internal: true
    push:
        internal: true
