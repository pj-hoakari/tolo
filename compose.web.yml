services:
    server:
        networks:
            - web

    edge-bridge:
        networks:
            - web

    web:
        image: ${TOLO_WEB_IMAGE:-tolo-web:74ce0f4}
        build:
            context: https://github.com/pj-hoakari/tolo-web.git#74ce0f4ab530d618d25784d1335b5fae2d95b9c3
            target: dev
            secrets:
                - npm_token
        environment:
            NEXT_TELEMETRY_DISABLED: "1"
            NEXT_PUBLIC_API_MOCKING: disabled
            FIREBASE_PROJECT_ID: demo-tolo
            FIRESTORE_EMULATOR_HOST: 127.0.0.1:8081
            FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
            GATEWAY_URL: http://server:8080
            SIGNALING_URL: http://edge-bridge:8787
            OBSERVATION_API_MOCKING: disabled
            TENANT_SUBDOMAIN_MOCKING: disabled
            GRAPH_ACCESS_TOKEN: ${GRAPH_ACCESS_TOKEN:-}
            OBSERVATION_ACCESS_TOKEN: ${OBSERVATION_ACCESS_TOKEN:-}
            TENANT_ACCESS_TOKEN: ${TENANT_ACCESS_TOKEN:-}
        ports:
            - "3000:3000"
        networks:
            - web
        depends_on:
            server:
                condition: service_started
            edge-bridge:
                condition: service_started

networks:
    web:

secrets:
    npm_token:
        environment: NPM_TOKEN
