services:
    nats:
        networks:
            - operation-nats

    push-relay-ready:
        image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              for _ in $$(seq 1 60); do
                wget -q -O /dev/null http://push-relay:8080/readyz && exit 0
                sleep 1
              done
              exit 1
        networks:
            - push
        depends_on:
            push-relay:
                condition: service_started
        restart: "no"

    server:
        networks:
            - operation

    operation:
        image: ${TOLO_OP_IMAGE:-tolo-operation:57b04d5}
        build:
            context: https://github.com/pj-hoakari/tolo-operation.git#57b04d521763c32ca877c324c85a5864280203f6
        environment:
            SERVER_ADDR: :8080
            DATABASE_URL: postgres://operation-db:5432/operation?sslmode=disable&user=operation&password=${TOLO_OP_DB_PASSWORD:-operation}
            INTERNAL_JWKS_URL: http://server:8080/.well-known/jwks.json
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_AUDIENCE: tolo-operation
            NATS_URL: nats://nats:4222
            NATS_STREAM_MAX_AGE: 24h
        networks:
            - operation
            - operation-db
            - operation-nats
        depends_on:
            operation-migrate:
                condition: service_completed_successfully
            push-relay-ready:
                condition: service_completed_successfully
            server:
                condition: service_started

    operation-migrate:
        image: ${TOLO_OP_MIGRATE_IMAGE:-tolo-operation-migrate:57b04d5}
        build:
            context: https://github.com/pj-hoakari/tolo-operation.git#57b04d521763c32ca877c324c85a5864280203f6
            target: migrate
        command:
            - -database
            - postgres://operation-db:5432/operation?sslmode=disable&user=operation&password=${TOLO_OP_DB_PASSWORD:-operation}
            - up
        networks:
            - operation-db
        depends_on:
            operation-db:
                condition: service_healthy
        restart: "no"

    operation-db:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_DB: operation
            POSTGRES_USER: operation
            POSTGRES_PASSWORD: ${TOLO_OP_DB_PASSWORD:-operation}
        networks:
            - operation-db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 5s
        volumes:
            - operation-data:/var/lib/postgresql

volumes:
    operation-data:

networks:
    operation:
        internal: true
    operation-db:
        internal: true
    operation-nats:
        internal: true
