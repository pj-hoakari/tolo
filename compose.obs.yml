services:
    nats:
        networks:
            - observation-nats

    push-relay-ready:
        image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              for _ in $$(seq 1 60); do
                wget -q -O /dev/null http://push-relay:8080/readyz && exit 0
                sleep 1
              done
              exit 1
        networks:
            - push
        depends_on:
            push-relay:
                condition: service_started
        restart: "no"

    server:
        networks:
            - observation

    observation:
        image: ${TOLO_OBS_IMAGE:-tolo-observation:4a1a56f}
        build:
            context: https://github.com/pj-hoakari/tolo-observation.git#4a1a56f9171d8894d0fd2f23185f23b2bd9a949b
        environment:
            SERVER_ADDR: :8080
            DATABASE_URL: postgres://observation-db:5432/observation?sslmode=disable&user=observation&password=${TOLO_OBS_DB_PASSWORD:-observation}
            INTERNAL_JWKS_URL: http://server:8080/.well-known/jwks.json
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_AUDIENCE: tolo-observation
            NATS_URL: nats://nats:4222
            GRAPH_AUTHORING_URL: http://server:8090
            FLOW_CONTROL_URL: http://flow-control:8080
            OPERATION_URL: http://server:8090
        networks:
            - observation
            - observation-db
            - observation-nats
            - flow-control
        depends_on:
            observation-migrate:
                condition: service_completed_successfully
            push-relay-ready:
                condition: service_completed_successfully
            server:
                condition: service_started

    observation-migrate:
        image: ${TOLO_OBS_MIGRATE_IMAGE:-tolo-observation-migrate:4a1a56f}
        build:
            context: https://github.com/pj-hoakari/tolo-observation.git#4a1a56f9171d8894d0fd2f23185f23b2bd9a949b
            target: migrate
        command:
            - -database
            - postgres://observation-db:5432/observation?sslmode=disable&user=observation&password=${TOLO_OBS_DB_PASSWORD:-observation}
            - up
        networks:
            - observation-db
        depends_on:
            observation-db:
                condition: service_healthy
        restart: "no"

    observation-db:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_DB: observation
            POSTGRES_USER: observation
            POSTGRES_PASSWORD: ${TOLO_OBS_DB_PASSWORD:-observation}
        networks:
            - observation-db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 5s
        volumes:
            - observation-data:/var/lib/postgresql

volumes:
    observation-data:

networks:
    observation:
        internal: true
    observation-db:
        internal: true
    observation-nats:
        internal: true
    flow-control:
        internal: true
